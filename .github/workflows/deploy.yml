name: Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}/api
  WEB_IMAGE: ${{ github.repository }}/web

jobs:
  build-push-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Atendefy.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-push-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: src/Atendefy.Web
          file: src/Atendefy.Web/Dockerfile
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # O deploy é disparado pelo webhook do Coolify (Hetzner), que faz o pull das
  # imagens e recria os containers. A versão deployada é a dos envs
  # API_VERSION/WEB_VERSION na UI do Coolify — atualize lá ao promover uma tag,
  # ou deixe `latest` para acompanhar sempre a última.
  #
  # Secrets a criar depois de instalar o Coolify (Settings → Secrets → Actions):
  #   COOLIFY_WEBHOOK_URL — recurso no Coolify → Webhooks → Deploy Webhook
  #   COOLIFY_API_TOKEN   — Coolify → Keys & Tokens → API tokens (escopo deploy)
  # Enquanto os secrets não existirem, o job apenas avisa e não falha.
  deploy:
    needs: [build-push-api, build-push-web]
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Trigger Coolify deploy
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          curl --fail-with-body -sS "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"

      - name: Skip notice
        if: ${{ env.COOLIFY_WEBHOOK_URL == '' }}
        run: echo "COOLIFY_WEBHOOK_URL não configurado — imagens publicadas no GHCR, deploy manual pelo Coolify."
